name: Verify client
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
      - run: npm run test:package
  published-release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --file test/isolated-release.Dockerfile --tag palatial-agent-isolation:0.1.4 .
      - run: docker run --rm --network none --read-only --tmpfs /tmp:rw,size=128m -e EXPECTED_TOOL_COUNT=12 palatial-agent-isolation:0.1.4
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const pkg = JSON.parse(await readFile('package.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;
          if (tag !== `v${pkg.version}`) throw new Error(`Tag ${tag} does not match package version ${pkg.version}`);
          NODE
      - run: npm run check
      - run: npm test
      - name: Build release tarball and checksum
        id: package
        run: |
          package=$(npm pack --ignore-scripts)
          sha256sum "$package" | tee "$package.sha256"
          echo "package=$package" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.package.outputs.package }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" "$PACKAGE" "$PACKAGE.sha256" --title "$RELEASE_TAG" --notes-file CHANGELOG.md
